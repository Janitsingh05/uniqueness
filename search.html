<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Search · uniqueness</title>
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/pages.css" />
</head>
<body>

<div class="app-shell">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="app-main">
    <header id="topbar" class="topbar"></header>

    <main class="page page--search">
      <div class="page__head">
        <h1>Search what you <span class="grad-text">said</span></h1>
        <p class="lead" style="max-width:470px">Saved projects and their transcripts are indexed by spoken words. Find the line, jump to the second.</p>
      </div>

      <input class="input" id="q" placeholder="Search a phrase, keyword or filename…" style="padding:15px 18px;background:#fff;box-shadow:var(--shadow-card);margin-bottom:16px" />
      <div class="eyebrow" id="resultLabel" style="margin-bottom:12px"></div>
      <div class="stack" style="gap:8px" id="results"></div>
    </main>
  </div>
</div>

<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script defer src="js/firebase-config.js"></script>
<script defer src="js/config.js"></script>
<script defer src="js/db.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/shell.js"></script>
<script defer src="js/captions.js"></script>
<script defer src="js/search.js"></script>
</body>
</html>
