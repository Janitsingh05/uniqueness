# Render.com blueprint. Deploy: push, then New > Blueprint > pick this repo.
# Set OPENAI_API_KEY and the RAZORPAY_* keys in the dashboard, not here.
services:
  - type: web
    name: uniqueness-backend
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free              # $0. Sleeps after 15min idle and is slow on FFmpeg —
                             # a burn-in render can take minutes instead of seconds.
                             # Bump to 'starter' later if that becomes a problem.
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        value: https://janitsingh05.github.io
      - key: WORK_DIR
        value: /tmp/uniqueness
      - key: FFMPEG_PRESET
        value: veryfast
