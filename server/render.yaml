# Render.com blueprint. Deploy: push, then New > Blueprint > pick this repo.
# Set OPENAI_API_KEY, the RAZORPAY_* keys, and FIREBASE_SERVICE_ACCOUNT in
# the dashboard, not here.
services:
  - type: web
    name: uniqueness-backend
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free              # $0. Sleeps after 15min idle and is slow on FFmpeg —
                             # a burn-in render can take minutes instead of seconds.
                             # Bump to 'starter' later if that becomes a problem.
    healthCheckPath: /api/health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: STT_PROVIDER          # 'openai' (default) or 'groq' (free tier)
        sync: false
      - key: GROQ_API_KEY          # only used when STT_PROVIDER=groq
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT   # full service-account JSON, one line
        sync: false
      - key: ALLOWED_ORIGINS
        # The same repo deploys to both GitHub Pages and the branded
        # custom domain (Vercel) — both need to be allowed to call this API.
        value: https://janitsingh05.github.io,https://www.uniqueness.online,https://uniqueness.online
      - key: WORK_DIR
        value: /tmp/uniqueness
      - key: FFMPEG_PRESET
        value: ultrafast   # free tier's CPU is the bottleneck, not output size
