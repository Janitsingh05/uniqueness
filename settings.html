<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Settings · uniqueness</title>
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://www.gstatic.com" crossorigin />
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
<link rel="stylesheet" href="css/pages.css" />
</head>
<body>

<div class="app-shell">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="app-main">
    <header id="topbar" class="topbar"></header>

    <main class="page page--narrow">
      <div class="page__head">
        <h1>Workspace <span class="grad-text">defaults</span></h1>
        <p class="lead" style="max-width:470px">Applied to every new project. Anything here can still be changed per clip in the studio.</p>
      </div>

      <div class="grid grid--split">
        <section class="card" style="padding:6px 20px" id="toggles"></section>

        <div class="stack" style="gap:16px">
          <section class="card card--pad">
            <h3 style="font-size:13.5px;margin-bottom:15px">Profile</h3>
            <div class="row" style="gap:13px;margin-bottom:16px">
              <div id="profileInitial" style="width:44px;height:44px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:700"></div>
              <div style="min-width:0">
                <div style="font-size:13.5px;font-weight:700" id="profileName"></div>
                <div style="font-size:12px;color:var(--faint);overflow:hidden;text-overflow:ellipsis" id="profileEmail"></div>
              </div>
            </div>
            <div class="stack" style="gap:8px;margin-bottom:14px">
              <div class="inset-row"><span class="muted">Plan</span><b id="profilePlan"></b></div>
              <div class="inset-row"><span class="muted">Minutes left</span><b id="profileMinutes"></b></div>
              <div class="inset-row"><span class="muted">Member since</span><b id="profileSince"></b></div>
            </div>
            <button class="btn btn--quiet btn--block" id="signOutBtn">Sign out</button>
          </section>

          <section class="card card--pad">
            <h3 style="font-size:13.5px;margin-bottom:11px">Default style</h3>
            <p style="font-size:13px;color:var(--mut);margin-bottom:13px">New clips open with <b id="defaultStyle" style="color:var(--ink)"></b>.</p>
            <a class="btn btn--quiet btn--block" href="templates.html">Change in Templates</a>
          </section>
        </div>
      </div>
    </main>
  </div>
</div>

<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script defer src="js/firebase-config.js"></script>
<script defer src="js/config.js"></script>
<script defer src="js/db.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/shell.js"></script>
<script defer src="js/account.js"></script>
</body>
</html>
